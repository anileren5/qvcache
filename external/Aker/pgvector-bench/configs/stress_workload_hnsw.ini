[workload]
# Stress benchmark (legacy stress runner semantics).
# Phases:
#   - Optional inserts
#   - Random invalidation via aker_invalidate_random(fraction)
#   - Timed search phase
wtype = stress-workload
name = stress_workload_hnsw_sample
limit = 10

[dataset]
base = dataset/SPACEV/base.npy
search = dataset/SPACEV/query.npy
# Legacy stress trace format is a dict with keys: search / insert
# (kept compatible)
gt_trace = output/workloads/stress_hnsw_trace.pkl
split_num = 100000
dim = 128

[postgres]
host = 127.0.0.1
port = 5432
user = postgres
password = postgres
database = postgres

datastore = spacev_hnsw_10m
datastore_clean =
psql_config = configs/postgresql.conf
pg_log = output/postgres.log

[pgvector]
type = hnsw
index_name = items_hnsw_idx
distance = vector_l2_ops
m = 16
ef_construction = 64
ef_search = 100

[env]
# You can set AKER_CONFIG_PATH here, or pass --aker-config to the bash scripts.
# AKER_CONFIG_PATH = configs/aker_bootstrap.ini
