[workload]
# Search-only benchmark (legacy: workloada)
wtype = search-workload
name = search_workload_hnsw_sample
# Top-K to request from pgvector during the benchmark run.
# (GT is always generated as Top-100 with L2 <->, hard-coded.)
limit = 10

[dataset]
# Dataset directory is expected under: dataset/<DATASET>/
# Base vectors in .npy format. Shape: (N, dim)
base = dataset/SPACEV/base.npy
# Search/query vectors in .npy format. Shape: (Q, dim)
search = dataset/SPACEV/query.npy
# Workload trace output (pickle). If the file already exists, generation will be skipped by default.
gt_trace = output/workloads/search_hnsw_trace.pkl
# split_num is unused for Search-workload.
split_num =
# Dimension for pgvector table.
dim = 128

[postgres]
host = 127.0.0.1
port = 5432
user = postgres
password = postgres
database = postgres

# Local PostgreSQL data directory name/path.
# Convention in this refactor:
# - If this is a name (no '/'), PGDATA becomes: datastore/<datastore>
# - If this contains '/', it is treated as a relative path under pgvector-bench/
#
datastore = spacev_hnsw_10m
# datastore_clean is optional. Default: <datastore>-clean under the same parent.
datastore_clean =
# Optional: postgresql.conf path used by pg_ctl -o --config-file=...
psql_config = configs/postgresql.conf
# Optional: pg_ctl -l log path
pg_log = output/postgres.log

[pgvector]
# Index type and runtime search parameter.
# Build parameters are used by the end-to-end pipeline.
type = hnsw
index_name = items_hnsw_idx
# This project uses L2 only.
distance = vector_l2_ops
# Build params
m = 16
ef_construction = 64
# Runtime param (optional)
ef_search = 100

[env]
# PostgreSQL server process reads these via getenv().
# You can set AKER_CONFIG_PATH here, or pass --aker-config to the bash scripts.
# AKER_CONFIG_PATH = configs/aker_bootstrap.ini
