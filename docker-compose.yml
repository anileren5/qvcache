services:
  qvcache:
    container_name: qvcache
    image: qvcache:latest
    build: .
    volumes:
      # Aker: the Aker tree is included via this bind mount at /app/external/Aker
      - .:/app
    working_dir: /app
    entrypoint: bash
    stdin_open: true
    tty: true
    depends_on:
      - postgres
    networks:
      - default

  postgres:
    container_name: postgres
    image: pgvector/pgvector:pg16
    ports:
      - "7000:5432"  # Use 7000 on host to avoid conflict with local PostgreSQL
    # HNSW builds set maintenance_work_mem=8GB; default /dev/shm is 64MB.
    shm_size: 16gb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
