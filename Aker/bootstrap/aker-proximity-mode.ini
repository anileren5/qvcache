# ANNSCache bootstrap config (Proximity Mode)
# - Requires building with:
#   - AKER_ENABLE_PROXIMITY_MODE=1
#   - AKER_ENABLE_POTLUCK_MODE=0
# - global_thresh must be > 0

[vector_format]
dimension = 128
vector_in_bytes = 512

[capacity]
pool_size = 1000000
in_topk = 10
top_delta = 5

[tuning]
global_thresh = 0.35
dropout = 0.0

risk_thresh = 0.35
alpha_tighten = 0.90
alpha_loosen = 1.10

[distance]
distance_metric = l2
