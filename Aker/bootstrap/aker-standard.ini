# ANNSCache bootstrap config (Standard Mode)
# - Standard Mode is the default build
#   - AKER_ENABLE_PROXIMITY_MODE=0
#   - AKER_ENABLE_POTLUCK_MODE=0

[vector_format]
dimension = 128
vector_in_bytes = 512

[capacity]
pool_size = 1000000
in_topk = 10
top_delta = 5

[tuning]
# Standard Mode does not use global_thresh, but we keep it for config completeness.
global_thresh = 0.0
dropout = 0.0

risk_thresh = 0.35
alpha_tighten = 0.90
alpha_loosen = 1.10

[distance]
distance_metric = l2
