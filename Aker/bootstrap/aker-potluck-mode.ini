# ANNSCache bootstrap config (Potluck Mode)
# - Requires building with:
#   - AKER_ENABLE_PROXIMITY_MODE=0
#   - AKER_ENABLE_POTLUCK_MODE=1
# - dropout is required in Potluck Mode and is interpreted as a percentage in [0, 100].

[vector_format]
dimension = 128
vector_in_bytes = 512

[capacity]
pool_size = 1000000
in_topk = 10
top_delta = 5

[tuning]
# Potluck baseline starts from 0.0 and tunes the global threshold at put().
global_thresh = 0.0
dropout = 10.0

risk_thresh = 0.35
alpha_tighten = 0.90
alpha_loosen = 1.10

[distance]
distance_metric = l2
